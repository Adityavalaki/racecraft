[build-system]
requires = ["setuptools>=78.1.1"]   # 78.1.1 fixes the path-traversal/command-injection advisories
build-backend = "setuptools.build_meta"

[project]
name = "racecraft"
version = "0.1.0"
description = "F1 strategy workbench: models hidden car state from public timing data and simulates races."
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.8",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Transitive, pinned to patched versions for their advisories (both resolve
    # cleanly under requests and fastf1): urllib3 GHSA-8988/gh4c/vxq7, PyJWT
    # GHSA-42vr. msgpack (GHSA-6v7p) cannot be floored here — signalrcore pins
    # it to 1.1.2 — but Racecraft records through fastf1's SignalR client, so
    # its msgpack path is not on ours. `build.setuptools>=78.1.1` keeps the
    # build tool patched too.
    "urllib3>=2.8.0",
    "PyJWT>=2.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# The desktop app: its own window on WebView2. Not needed by the CLI or tests.
app = ["pywebview>=5"]

[project.scripts]
racecraft-ingest = "racecraft.ingest.cli:main"
racecraft-serve = "racecraft.api.serve:main"
racecraft-analyse = "racecraft.model.cli:main"
racecraft-live = "racecraft.live.cli:main"

[project.gui-scripts]
# A GUI-subsystem launcher: double-clicking it opens no console window.
racecraft = "racecraft.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Pirelli's compound nominations, read by racecraft.model.compounds.
"racecraft.model" = ["*.csv"]
# The app's icon, used by its window and its shortcuts.
"racecraft.app" = ["*.ico", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to F1 live timing (deselect with -m 'not network')",
    "realdata: needs the ingested lake (skips automatically when a session is missing)",
]
