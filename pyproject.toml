[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racecraft"
version = "0.1.0"
description = "F1 strategy workbench: models hidden car state from public timing data and simulates races."
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.8",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
racecraft-ingest = "racecraft.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to F1 live timing (deselect with -m 'not network')"]
